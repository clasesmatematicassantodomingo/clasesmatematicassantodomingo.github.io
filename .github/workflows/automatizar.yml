name: Automatizar Blog SEO Cada 3 Dias

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *' # Se ejecuta cada 3 días

jobs:
  construir-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script generador
        run: python generar_blog.py

      - name: Subir artículos generados automáticamente
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generación de artículos de blog desde la parrilla SEO optimizada"
          branch: main
          # Forzar el rebase automático para evitar conflictos de ramas divergentes
          push_options: '--force'
