name: Automatizar Blog SEO Cada 3 Dias

on:
  workflow_dispatch:
  schedule:
    # Ejecutar a las 08:00 UTC (03:00 AM Ecuador) - hora de mínima saturación global
    - cron: '0 8 */3 * *'

jobs:
  construir-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librería OpenAI (compatible con Groq)
        run: pip install openai

      - name: Actualizar y reorganizar keywords (Detectar borrados)
        run: python actualizar_keywords.py

      - name: Listar modelos disponibles en Groq
        run: python listar_modelos_groq.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Ejecutar script generador de blog
        run: python generar_blog.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Subir artículos y JSON actualizados automáticamente
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-actualización de keywords y generación de nuevo artículo de blog"
