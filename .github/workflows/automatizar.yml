name: Automatizar Blog SEO Cada 3 Dias

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 08:00 UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub cuando quieras

jobs:
  construir-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar script generador
        run: python generar_blog.py

      - name: Subir artículos generados automáticamente
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generación de artículos de blog desde la parrilla SEO optimizada"
          branch: main
