name: Automatizar Blog SEO Diario con Reintentos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  construir-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librería Google GenAI
        run: pip install google-genai

      - name: Actualizar y reorganizar keywords (Detectar borrados)
        run: python actualizar_keywords.py

      - name: Ejecutar script generador de blog (con reintentos distribuidos)
        run: python generar_blog.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Subir artículos, JSON y estado actualizados automáticamente
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generación de artículo con sistema de reintentos distribuidos"
          commit_options: '--no-verify'
          push_options: '--force-with-lease'
          skip_fetch: false
          file_pattern: '*'
